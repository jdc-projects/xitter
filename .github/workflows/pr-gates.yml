name: PR gates

on:
  pull_request:
    branches: [dev]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - "packages/**"
              - "package.json"
              - "package-lock.json"
              - "turbo.json"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  gates:
    # Build, ESLint, tsc, unit + integration tests via turbo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build, lint, typecheck, tests
        run: npx turbo run lint typecheck test build

  repo-analysis:
    # fallow + react-doctor; needs the base ref for changed-file attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch base ref
        run: git fetch origin dev:refs/remotes/origin/dev
      - run: npm run lint:repo

  playwright-web:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-web-report
          path: tests/playwright/web/report
          retention-days: 7

  e2e:
    # Full-stack e2e against the docker dependency stack. Skeleton phase:
    # specs cover public pages only; grows with each feature ticket.
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start stack
        run: |
          npm run deps:up
          npm run build
        env:
          XITTER_ENV: ci
      - run: npm run test:e2e
        env:
          CI: 'true'
          XITTER_ENV: ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-report
          path: tests/playwright/e2e/report
          retention-days: 7

  mutation:
    # Scoped to affected workspaces in PRs; full runs happen on merge to dev.
    runs-on: ubuntu-latest
    needs: [changes, gates]
    if: needs.changes.outputs.packages != '[]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run mutate --filter=...[origin/dev]
