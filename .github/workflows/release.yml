name: Release

on:
  push:
    branches: [prod]

# Gitflow: release branch merged into prod tags a semver release and applies
# infra/iac/environments/prod. Activates with the first deploy ticket.
jobs:
  release:
    runs-on: ubuntu-latest
    if: false # enable with the deploy pipeline ticket
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
