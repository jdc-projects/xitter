name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Serialize per branch (effectively per env: this workflow only runs on dev).
# Queue, never cancel: cancelling mid-apply abandons the job while it holds
# the tofu state lock, which then hangs until timeout - worse than waiting.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Full mutation run (all workspaces, incremental reports)
        run: npm run mutate

  build-images:
    # Builds and pushes per-app images from the repo-root context; Tofu
    # deploy wiring (infra/iac/environments/dev) consumes these tags.
    runs-on: ubuntu-latest
    needs: full-mutation
    if: success()
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xitter-web
            dockerfile: apps/web/Dockerfile
          - image: xitter-cms
            dockerfile: apps/cms/Dockerfile
          - image: xitter-admin
            dockerfile: apps/admin/Dockerfile
          - image: xitter-social
            dockerfile: apps/services/social/Dockerfile
          - image: xitter-posts
            dockerfile: apps/services/posts/Dockerfile
          - image: xitter-media
            dockerfile: apps/services/media/Dockerfile
          - image: xitter-feed
            dockerfile: apps/services/feed/Dockerfile
          - image: xitter-search
            dockerfile: apps/services/search/Dockerfile
          - image: xitter-fanout
            dockerfile: apps/workers/fanout/Dockerfile
          - image: xitter-media-process
            dockerfile: apps/workers/media-process/Dockerfile
          - image: xitter-search-index
            dockerfile: apps/workers/search-index/Dockerfile
          - image: xitter-reset
            dockerfile: packages/scripts/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable sha-<shortsha> tag for exact pinning + mutable dev tag the
      # dev environment rolls forward on. All names lowercase for GHCR.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/jdc-projects/${{ matrix.image }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/jdc-projects/${{ matrix.image }}:dev
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  tofu-apply:
    # Applies infra/iac/environments/dev after images exist. Self-hosted
    # runner - the cluster API is private.
    runs-on: self-hosted
    needs: build-images
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - name: Write kubeconfig
        run: |
          if [ -z "${{ secrets.CLUSTER_KUBECONFIG }}" ]; then
            echo '::error::CLUSTER_KUBECONFIG secret is not set - see docs/runbooks/04-ci-and-secrets.md'
            exit 1
          fi
          mkdir -p infra
          printf '%s' "${{ secrets.CLUSTER_KUBECONFIG }}" > infra/cluster.yml
      - name: tofu apply (dev)
        working-directory: infra/iac/environments/dev
        # Pin the apply to this run's immutable sha tag: the mutable `dev`
        # tag never changes the deployment spec, so tofu has nothing to roll
        # and merged code only reached pods when a spec changed for another
        # reason (bug: the 2026-08-21 metrics hotfix deployed "successfully"
        # without restarting anything). The sha tag is pushed by build-images.
        # NOTE: a step-local shell var, not GITHUB_ENV - GITHUB_ENV writes
        # only reach SUBSEQUENT steps, and referencing it in the same step
        # expanded empty (`image_tag=sha-` → ImagePullBackOff for 9h).
        # TF_VAR_cap_*: bot protection keys (spec 02 §3.2) - web is
        # XITTER_CAP_REQUIRED and crashloops without them.
        env:
          TF_VAR_cap_site_key: ${{ secrets.XITTER_CAP_SITE_KEY }}
          TF_VAR_cap_secret_key: ${{ secrets.XITTER_CAP_SECRET_KEY }}
          # Providers route in-cluster: the runner is on the LAN, and the
          # public idp/sentry URLs present the home IP at Cloudflare - any
          # CrowdSec ban on it kills deploys. Internal services have no edge.
          TF_VAR_provider_keycloak_url: http://keycloak-keycloakx-http.keycloak:80
          TF_VAR_provider_sentry_base_url: http://sentry-web.sentry:9000/api/
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "Applying with image tag sha-${SHORT_SHA}"
          tofu init
          tofu apply -auto-approve -input=false -var="image_tag=sha-${SHORT_SHA}"
