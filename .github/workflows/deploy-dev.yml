name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  full-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Full mutation run (all workspaces, incremental reports)
        run: npm run mutate

  build-images:
    # Builds and pushes per-app images from the repo-root context; Tofu
    # deploy wiring (infra/iac/environments/dev) consumes these tags.
    runs-on: ubuntu-latest
    needs: full-mutation
    if: success()
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: web
            image: xitter-web
            dockerfile: apps/web/Dockerfile
          - workspace: cms
            image: xitter-cms
            dockerfile: apps/cms/Dockerfile
          - workspace: admin
            image: xitter-admin
            dockerfile: apps/admin/Dockerfile
          - workspace: '@xitter/service-social'
            image: xitter-social
            dockerfile: apps/services/social/Dockerfile
          - workspace: '@xitter/service-posts'
            image: xitter-posts
            dockerfile: apps/services/posts/Dockerfile
          - workspace: '@xitter/service-media'
            image: xitter-media
            dockerfile: apps/services/media/Dockerfile
          - workspace: '@xitter/service-feed'
            image: xitter-feed
            dockerfile: apps/services/feed/Dockerfile
          - workspace: '@xitter/service-search'
            image: xitter-search
            dockerfile: apps/services/search/Dockerfile
          - workspace: '@xitter/worker-fanout'
            image: xitter-fanout
            dockerfile: apps/workers/fanout/Dockerfile
          - workspace: '@xitter/worker-media-process'
            image: xitter-media-process
            dockerfile: apps/workers/media-process/Dockerfile
          - workspace: '@xitter/worker-search-index'
            image: xitter-search-index
            dockerfile: apps/workers/search-index/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable sha-<shortsha> tag for exact pinning + mutable dev tag the
      # dev environment rolls forward on. All names lowercase for GHCR.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/jdc-projects/${{ matrix.image }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/jdc-projects/${{ matrix.image }}:dev
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  tofu-apply:
    # Applies infra/iac/environments/dev after images exist. Self-hosted
    # runner - the cluster API is private.
    runs-on: self-hosted
    needs: build-images
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - name: Write kubeconfig
        run: |
          if [ -z "${{ secrets.CLUSTER_KUBECONFIG }}" ]; then
            echo '::error::CLUSTER_KUBECONFIG secret is not set - see docs/runbooks/04-ci-and-secrets.md'
            exit 1
          fi
          mkdir -p infra
          printf '%s' "${{ secrets.CLUSTER_KUBECONFIG }}" > infra/cluster.yml
      - name: tofu apply (dev)
        working-directory: infra/iac/environments/dev
        run: |
          tofu init
          tofu apply -auto-approve -input=false
