name: 'xitter setup'
description: >-
  Node + npm download cache + optional Playwright chromium cache for xitter
  CI jobs. Runs AFTER actions/checkout (local actions need the repo present).
  node_modules itself is NOT cached: actions/cache tar of the ~200k-file tree
  silently truncated (39MB of 2.3GB), so jobs restore a broken tree. The
  npm download cache + npm ci is reliable and only ~60-90s per job.

inputs:
  playwright:
    description: 'Cache and install Playwright chromium'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci
      shell: bash

    - name: Cache Playwright chromium
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      id: playwright-browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright chromium
      if: inputs.playwright == 'true'
      # The chromium download has stalled >18m with zero output on multiple
      # runners. Composite-action steps cannot use timeout-minutes, so bound
      # it with coreutils `timeout`. A timed-out attempt orphans its apt-get
      # child holding the dpkg lock - reap it and wait for the lock before
      # the single retry, or the retry insta-fails with lock contention.
      run: |
        if timeout 10m npm run test:install; then exit 0; fi
        echo "first install attempt failed or timed out - clearing apt locks and retrying once"
        sudo pkill -9 -f 'apt(-get)?' 2>/dev/null || true
        for i in $(seq 1 30); do
          sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
          sleep 2
        done
        sudo dpkg --configure -a >/dev/null 2>&1 || true
        timeout 10m npm run test:install
      shell: bash
