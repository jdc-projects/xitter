name: 'xitter setup'
description: >-
  Cached Node + node_modules for xitter CI jobs. Runs AFTER actions/checkout
  (local actions need the repo present).

  Exactly one job per run should set `save: true` (the earliest job, so the
  entry exists for restore-only jobs on the next run); restore-only jobs fall
  back to a direct npm ci on a miss (first run of a lockfile change). The
  node_modules save is guarded on job success so a failed job can never poison
  the immutable cache entry with a partial tree.

inputs:
  playwright:
    description: 'Cache and install Playwright chromium'
    required: false
    default: 'false'
  save:
    description: 'Allow writing the node_modules cache entry (designate ONE job)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Restore node_modules
      id: node-modules
      uses: actions/cache/restore@v6
      with:
        path: node_modules
        key: node-modules-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - name: Save node_modules
      if: inputs.save == 'true' && steps.node-modules.outputs.cache-hit != 'true' && success()
      uses: actions/cache/save@v6
      with:
        path: node_modules
        key: node-modules-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Cache Playwright chromium
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      id: playwright-browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright chromium
      if: inputs.playwright == 'true' && steps.playwright-browsers.outputs.cache-hit != 'true'
      run: npm run test:install
      shell: bash
