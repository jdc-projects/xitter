name: 'xitter setup'
description: >-
  Cached Node + node_modules + Playwright chromium for xitter CI jobs.
  Runs AFTER actions/checkout (local actions need the repo present).
  node_modules is cached on the lockfile hash (immutable key); npm ci only
  runs on a miss. Set `playwright: true` to also cache the chromium download.

  The node_modules save is guarded on job success so a failed job can never
  poison the immutable cache entry with a partial tree.

inputs:
  playwright:
    description: 'Cache and install Playwright chromium'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # v2 namespace: the initial run of this action failed before npm ci and
    # cached an empty tree under the v1 key. Immutable keys never re-save, so
    # bump the namespace to orphan the poisoned entry.
    - uses: actions/cache@v6
      id: node-modules
      with:
        path: node_modules
        key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - name: Cache Playwright chromium
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      id: playwright-browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright chromium
      if: inputs.playwright == 'true' && steps.playwright-browsers.outputs.cache-hit != 'true'
      run: npm run test:install
      shell: bash
