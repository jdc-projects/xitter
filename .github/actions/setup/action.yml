name: 'xitter setup'
description: >-
  Node + npm download cache + optional Playwright chromium cache for xitter
  CI jobs. Runs AFTER actions/checkout (local actions need the repo present).
  node_modules itself is NOT cached: actions/cache tar of the ~200k-file tree
  silently truncated (39MB of 2.3GB), so jobs restore a broken tree. The
  npm download cache + npm ci is reliable and only ~60-90s per job.

inputs:
  playwright:
    description: 'Cache and install Playwright chromium'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci
      shell: bash

    - name: Cache Playwright chromium
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      id: playwright-browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright chromium
      if: inputs.playwright == 'true'
      # The chromium download has stalled >18m with zero output on multiple
      # runners. Composite-action steps cannot use timeout-minutes, so bound
      # it with coreutils `timeout` and retry once; failure fails the job
      # loudly instead of hanging the PR.
      run: |
        if timeout 10m npm run test:install; then exit 0; fi
        echo "first install attempt failed or timed out - retrying once"
        timeout 10m npm run test:install
      shell: bash
