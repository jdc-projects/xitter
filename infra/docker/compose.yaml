name: xitter

# One environment copy = one compose project (set by @xitter/scripts with
# --project-name xitter-${XITTER_ENV}), giving isolated containers, volumes,
# and networks per worktree / parallel run.

x-common: &common
  restart: unless-stopped
  networks:
    - xitter

services:
  traefik:
    image: traefik:v3.6
    <<: *common
    ports:
      - '${XITTER_EDGE_PORT:-8080}:80'
    volumes:
      - ../proxy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../proxy/traefik/dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # Consumed by the dynamic file templates (host apps are env-port driven).
      XITTER_WEB_PORT: ${XITTER_WEB_PORT:-3456}
      XITTER_CMS_PORT: ${XITTER_CMS_PORT:-3457}
      XITTER_ADMIN_PORT: ${XITTER_ADMIN_PORT:-3458}
      XITTER_SOCIAL_PORT: ${XITTER_SOCIAL_PORT:-8101}
      XITTER_POSTS_PORT: ${XITTER_POSTS_PORT:-8102}
      XITTER_MEDIA_PORT: ${XITTER_MEDIA_PORT:-8103}
      XITTER_FEED_PORT: ${XITTER_FEED_PORT:-8104}
      XITTER_SEARCH_PORT: ${XITTER_SEARCH_PORT:-8105}
      XITTER_RUSTFS_PORT: ${XITTER_RUSTFS_PORT:-9000}

  postgres:
    image: postgres:18.6-alpine
    <<: *common
    environment:
      POSTGRES_USER: xitter
      POSTGRES_PASSWORD: ${XITTER_POSTGRES_PASSWORD:-xitter-local}
      POSTGRES_DB: xitter
    ports:
      - '${XITTER_POSTGRES_PORT:-5532}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xitter']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    <<: *common
    ports:
      - '${XITTER_KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${XITTER_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2
    <<: *common
    environment:
      RUSTFS_ACCESS_KEY: ${XITTER_RUSTFS_ACCESS_KEY:-xitter-local}
      RUSTFS_SECRET_KEY: ${XITTER_RUSTFS_SECRET_KEY:-xitter-local-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '${XITTER_RUSTFS_PORT:-9000}:9000'
    volumes:
      - rustfs-data:/data

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    <<: *common
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: 'false'
    ports:
      - '${XITTER_OPENSEARCH_PORT:-9200}:9200'
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200 >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.1-alpine
    <<: *common
    ports:
      - '${XITTER_VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.7.1
    <<: *common
    command: ['start-dev']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${XITTER_KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${XITTER_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    ports:
      - '${XITTER_KEYCLOAK_PORT:-8090}:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  pg-data:
  kafka-data:
  rustfs-data:
  os-data:
  valkey-data:
  keycloak-data:

networks:
  xitter:
